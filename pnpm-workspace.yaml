  "@effect/platform-bun": "catalog:"
  "@effect/platform-node": "catalog:"
  "@effect/platform-node-shared": "catalog:"
  "@effect/sql-pg": "catalog:"
  "@effect/sql-sqlite-bun": "catalog:"
  "@effect/vitest": "catalog:"
  "@effect/vitest>@vitest/runner": "-"
  "@effect/vitest>vitest": "-"
  "@effect/platform-node>undici": "8.10.2"
  "brace-expansion@<1.1.21": "1.1.21"
  "brace-expansion@>=2.0.0 <2.1.7": "2.1.7"
  "brace-expansion@>=3.0.0 <5.0.12": "5.0.12"
  dompurify: "3.4.13"
  esbuild: "0.28.1"
  fast-uri: "3.1.8"
  # Keep production and build dependencies above their patched advisory releases.
  "@modelcontextprotocol/sdk": "1.31.0"
  "http-cache-semantics@<4.3.0": "4.3.0"
  "seroval@<1.6.3": "1.6.3"
  "source-map-js@<1.2.2": "1.2.2"
  "tinypool@>=2.0.0 <2.1.2": "2.1.2"
  "@xmldom/xmldom@>=0.8.0 <0.8.15": "0.8.15"
