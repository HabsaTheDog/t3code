  "path-to-regexp@>=4.0.0 <6.3.0": "6.3.0"
  postcss: "8.5.26"
  tar: "7.5.21"
  "@types/node": "catalog:"
  effect: "catalog:"
  vite: "catalog:"
  vitest: "catalog:"
  yaml: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
packageExtensions:
  "@effect/vitest@*":
    dependencies:
      vite-plus: "catalog:"
    peerDependenciesMeta:
      vitest:
        optional: true
  "vite-plus@*":
    dependencies:
      vite: "catalog:"
patchedDependencies:
  "@effect/vitest@4.0.0-beta.78": patches/@effect__vitest@4.0.0-beta.78.patch
  "@pierre/diffs@1.1.20": patches/@pierre%2Fdiffs@1.1.20.patch
