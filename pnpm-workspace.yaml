  - "apps/desktop"
  - "apps/server"
  - "apps/web"
  - "oxlint-plugin-t3code"
  - "packages/*"
  - "scripts"

onlyBuiltDependencies:
  - electron
  - esbuild
  - msgpackr-extract
  - node-pty
  - sharp

ignoredBuiltDependencies:
  - msw

